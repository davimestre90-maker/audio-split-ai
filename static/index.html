<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b16">
  <title>Audio Split AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #090b16;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090b16;
      transition: opacity 0.6s ease;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      width: 105px;
      height: 105px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
      animation: pulse 1.5s infinite ease-in-out;
    }

    .logo svg {
      width: 70px;
      height: 70px;
    }

    .title {
      margin-top: 22px;
      color: white;
      font-size: 27px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .loading-text {
      margin-top: 12px;
      color: #aeb3c7;
      font-size: 16px;
    }

    .dots::after {
      content: "";
      animation: dots 1.4s infinite;
    }

    @keyframes dots {
      0% {
        content: "";
      }

      25% {
        content: ".";
      }

      50% {
        content: "..";
      }

      75%,
      100% {
        content: "...";
      }
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    #app {
      min-height: 100%;
      overflow-y: auto;
      background: #090b16;
      color: white;
    }
  </style>
</head>

<body>

  <!-- TELA DE CARREGAMENTO -->

  <div id="loading">

    <div class="logo">

      <svg viewBox="0 0 64 64" fill="none">

        <path
          d="M17 37V27M25 43V21M33 48V16M41 42V22M49 35V29"
          stroke="white"
          stroke-width="5"
          stroke-linecap="round"
        />

        <circle
          cx="32"
          cy="32"
          r="28"
          stroke="white"
          stroke-opacity=".25"
          stroke-width="2"
        />

      </svg>

    </div>

    <div class="title">
      AUDIO SPLIT AI
    </div>

    <div class="loading-text">
      Carregando<span class="dots"></span>
    </div>

  </div>


  <!-- APLICATIVO -->

  <div id="app">

    <!-- A interface principal será colocada aqui nas próximas etapas. -->

  </div>


  <script>

    window.addEventListener("load", function() {

      setTimeout(function() {

        const loading = document.getElementById("loading");

        loading.classList.add("hide");

        setTimeout(function() {
          loading.style.display = "none";
        }, 600);

      }, 1800);

    });

  </script>

</body>
</html>
